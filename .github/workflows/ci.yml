name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest -q

      # The portfolio's signature check: every number in the README is
      # generated, so a hand-edited result fails the build rather than
      # silently drifting from the code that produced it.
      - name: Verify generated results are current
        run: |
          for s in scripts/generate_results.py scripts/generate_test_report.py; do
            [ -f "$s" ] && uv run python "$s"
          done
          git diff --exit-code results/ \
            || (echo "results/ is stale -- regenerate and commit" && exit 1)

      # generate_test_report.py exits non-zero if any test file can reach a
      # real socket. The suite must stay replayable: a live call in CI is a
      # billed, flaky build that depends on a third party's uptime.
      - name: No test may make a live API call
        run: uv run python scripts/generate_test_report.py
