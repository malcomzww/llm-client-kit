[project]
name = "llm-client-kit"
version = "0.1.0"
description = "The provider-agnostic async LLM client the rest of the portfolio is built on: bounded concurrency, retries with jitter, deadline propagation, cost accounting, record/replay cassett"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
